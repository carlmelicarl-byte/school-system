# ============================================================
# ElimuPro — nginx reverse-proxy config (Linux cloud server)
# Place in: /etc/nginx/sites-available/elimupro
# Then:     sudo ln -s /etc/nginx/sites-available/elimupro /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Assumes gunicorn runs on 127.0.0.1:8000 (see elimupro.service)
# ============================================================
server {
    listen 80;
    server_name your-school-domain.com;   # <-- change to your domain

    # Redirect all traffic to HTTPS (certbot will configure 443 automatically)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                             # nginx >= 1.25.1 (drop this line on older nginx and use: listen 443 ssl http2;)
    server_name your-school-domain.com;

    # profile photos / logos are uploaded as base64 JSON (~1.3x file size) —
    # nginx's default of 1m would reject them with 413
    client_max_body_size 10m;

    # --- obtain with:  sudo certbot --nginx -d your-school-domain.com ---
    ssl_certificate     /etc/letsencrypt/live/your-school-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-school-domain.com/privkey.pem;

    # uploads & static served directly by nginx (fast)
    location /static/ {
        alias /opt/elimupro/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # everything else -> gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
